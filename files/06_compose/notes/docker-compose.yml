# Приложение «Заметки» — практика 6.
#
# Два сервиса: приложение на Flask и база PostgreSQL. Файл нарочно
# небольшой: на нём разбирается устройство Compose, а не число ключей.
#
# Поля version: в файле нет и быть не должно. В Compose v2 схема
# определяется по составу ключей, а version вызывает предупреждение
# «the attribute version is obsolete» и сбивает с толку: файл выглядит
# как файл Compose v1. Подробный разбор — в шаге 2 практики.

# Имя проекта. Без него Compose взял бы имя каталога, а с ним все
# объекты называются предсказуемо: контейнеры notes-web-1 и notes-db-1,
# том notes_pgdata. Имя проекта — это единица работы: одна команда
# docker compose down убирает ровно то, что подняла эта пара
# «файл + имя проекта», и не трогает чужие контейнеры на машине.
name: notes

services:

  # ------------------------------------------------------------- база
  db:
    # image вместо build: готовый образ берём из реестра.
    # Тег закреплён: с тегом latest занятие через месяц показало бы
    # другой результат.
    image: postgres:18-alpine

    # Политика перезапуска: упавший сервис Docker поднимет снова.
    # unless-stopped, а не always: контейнер, остановленный руками
    # командой docker compose stop, после перезагрузки машины
    # останется остановленным — и это ровно то, чего ждёт человек.
    restart: unless-stopped

    # Значения обязательны: ${ИМЯ:?текст} означает «если переменной нет,
    # не запускайся и скажи вот это». Так пустой пароль не превратится
    # в загадочную ошибку внутри базы.
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB не задан, скопируйте .env.example в .env}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER не задан, скопируйте .env.example в .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, скопируйте .env.example в .env}"

    volumes:
      # Именованный том: данные базы должны переживать удаление
      # контейнера. Точка подключения — /var/lib/postgresql, а не
      # привычный /var/lib/postgresql/data: в образе postgres:18 каталог
      # данных равен /var/lib/postgresql/18/docker, и том объявлен
      # на уровень выше. Ошибка тут не видна сразу: база поднимется
      # и будет работать, но данные окажутся внутри контейнера.
      # Проверить, где каталог данных на самом деле:
      #   docker compose exec db psql -U notes -c 'show data_directory'
      - pgdata:/var/lib/postgresql

    healthcheck:
      # pg_isready возвращает 0, только когда сервер принимает
      # соединения, — это проверка готовности, а не «процесс жив».
      # Двойной $$ нужен потому, что одиночный $ Compose подставил бы
      # сам, из .env, ещё при разборе файла, и внутри контейнера
      # оказалась бы не переменная, а её значение.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------ приложение
  web:
    # build вместо image: образ собирается на месте из каталога ./app.
    # context — каталог сборки; всё, что из него не исключено файлом
    # .dockerignore, доступно инструкциям COPY.
    build:
      context: ./app

    restart: unless-stopped

    environment:
      # db — это имя сервиса. Внутри сети проекта имена сервисов
      # разрешаются в адреса контейнеров (практика 5), поэтому
      # приложению не нужно знать адрес базы заранее.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-notes}"
      POSTGRES_USER: "${POSTGRES_USER:-notes}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан, скопируйте .env.example в .env}"
      PORT: "5000"

    # ports публикует порт на машину, формат «хост:контейнер»: слева
    # порт машины, справа порт внутри контейнера. Внутри приложение
    # слушает 5000, наружу открываем 8080: 5000 на машине часто занят
    # другими учебными контейнерами.
    ports:
      - "${NOTES_PORT:-8080}:5000"

    # depends_on с condition: service_healthy ждёт не «контейнер
    # запущен», а «healthcheck прошёл». Без условия сервис стартовал бы
    # одновременно с базой и падал бы на первом запросе — это
    # классическая ошибка, разобранная в шаге 6 практики.
    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      # Проверяем не «процесс жив», а то, ради чего сервис существует:
      # отвечает ли приложение на запрос. Страница /healthz заодно
      # проверяет доступность базы.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


# Тома объявляются на верхнем уровне. Короткая запись pgdata: означает
# том с настройками по умолчанию; Docker создаёт его при первом запуске
# и хранит в /var/lib/docker/volumes (практика 4).
volumes:
  pgdata:
