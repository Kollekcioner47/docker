# Конфигурация frontend-сервиса стека «Заметки» (практика 7).
#
# Сервис слушает 8080, а не 80: контейнер запускается от пользователя
# nginx, а порты ниже 1024 в Linux требуют прав root. Наружу порт
# публикует Swarm — на каждой ноде кластера он отвечает на 80.

server {
    listen 8080;
    server_name _;

    # Адрес backend берётся из переменной, а не пишется прямо
    # в proxy_pass, и это принципиально. Имя из proxy_pass nginx
    # разбирает один раз — при запуске. Если в этот момент сервиса
    # backend в DNS ещё нет (его задачи только создаются), nginx
    # завершается с ошибкой «host not found in upstream "backend"»,
    # и задача перезапускается по кругу, пока backend не появится.
    # Переменная заставляет разбирать имя на каждом запросе: frontend
    # спокойно переживает тот момент, когда backend ещё не поднялся.
    # Цена: опечатка в имени проявится не при запуске, а ответом 502.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:5000;

    # Проверка живости для healthcheck из файла стека. Отвечает сам
    # nginx, не обращаясь к backend: иначе недоступная база выглядела бы
    # как сломанный frontend, и Swarm перезапускал бы не тот сервис.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # 127.0.0.11 — встроенный DNS Docker; в overlay-сети кластера
        # он же отвечает за имена сервисов. По имени backend запрос
        # уйдёт на одну из работающих реплик, где бы они ни находились.
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Таймауты выставлены явно: по умолчанию nginx ждёт ответа
        # приложения минуту, и всё это время задача считается живой,
        # хотя на самом деле уже не отвечает.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
